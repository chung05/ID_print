<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身分證線上方正列印工具</title>
    <style>
        /* --- 網頁預覽樣式 --- */
        body { font-family: sans-serif; background: #f5f5f5; padding: 20px; text-align: center; }
        .controls { margin-bottom: 20px; }
        .btn { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; margin: 0 5px; }
        .btn:hover { background: #0056b3; }
        
        /* 畫布容器（模擬 A4 寬度） */
        #print-area {
            background: white;
            width: 210mm;
            min-height: 140mm;
            margin: 0 auto;
            padding: 20mm;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            gap: 15mm;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* 橫排與豎排控制 */
        .layout-horizontal { flex-direction: row; }
        .layout-vertical { flex-direction: column; }

        /* 【精準尺寸控制】
           總尺寸：86mm x 54mm (符合標準 85.7mm 四捨五入)
           內距 padding: 3mm (四周留白)
           實際圖片可用範圍：80mm x 48mm
        */
        .card-box {
            width: 86mm;
            height: 54mm;
            padding: 3mm; 
            border: 2px dashed #ccc;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box; /* 確保 padding 不會撐大總外框 */
            background: #fafafa;
            cursor: pointer;
            position: relative;
        }
        
        /* 核心修正：改為 contain，確保照片完整不被裁切 */
        .card-box img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            background: transparent;
        }
        
        .card-box input[type="file"] { display: none; }
        .placeholder { color: #888; font-size: 14px; text-align: center; pointer-events: none; }

        /* --- 🖨️ 列印專用樣式 --- */
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            #print-area {
                box-shadow: none;
                margin: 0;
                padding: 0;
                width: auto;
                height: auto;
            }
            /* 列印時移除虛線框，保留精準的 3mm 透明留邊 */
            .card-box {
                width: 86mm !important;
                height: 54mm !important;
                padding: 3mm !important;
                border: none !important; 
                background: transparent !important;
            }
        }
    </style>
</head>
<body>

    <div class="controls no-print">
        <h2>身分證列印工具（完美比例修正版）</h2>
        <p style="color: #666; font-size: 14px;">已修正：總尺寸 86x54mm，內嵌 80x48mm 身分證，四周留空 3mm，圖片完整不裁切</p>
        <button class="btn" onclick="changeLayout('horizontal')">橫排 (左右)</button>
        <button class="btn" onclick="changeLayout('vertical')">豎排 (上下)</button>
        <button class="btn" style="background:#28a745;" onclick="window.print()">🖨️ 開始列印</button>
    </div>

    <div id="print-area" class="layout-horizontal">
        
        <label class="card-box" id="box-front">
            <span class="placeholder">點選上傳【正面】照片</span>
            <input type="file" accept="image/*" onchange="handleUpload(this, 'front')">
        </label>

        <label class="card-box" id="box-back">
            <span class="placeholder">點選上傳【反面】照片</span>
            <input type="file" accept="image/*" onchange="handleUpload(this, 'back')">
        </label>

    </div>

    <script>
        function handleUpload(input, type) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const box = document.getElementById(`box-${type}`);
                    box.innerHTML = `<img src="${e.target.result}" alt="${type}">`;
                }
                reader.readAsDataURL(file);
            }
        }

        function changeLayout(direction) {
            const area = document.getElementById('print-area');
            if (direction === 'horizontal') {
                area.className = 'layout-horizontal';
            } else {
                area.className = 'layout-vertical';
            }
        }
    </script>
</body>
</html>
