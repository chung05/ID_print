<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身分證 / 存摺封面 線上列印工具</title>
    <style>
        /* --- 網頁預覽樣式 --- */
        body { font-family: sans-serif; background: #f5f5f5; padding: 20px; text-align: center; }
        .controls { margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px; max-width: 700px; margin: 0 auto 20px auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .tab-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; font-size: 16px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; font-weight: bold; }
        .tab-btn.active { background: #007bff; color: white; border-color: #007bff; }

        .btn { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; margin: 5px; font-weight: bold; }
        .btn:hover { background: #218838; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        
        .options-group { margin: 15px 0; font-size: 14px; display: flex; justify-content: center; gap: 20px; background: #f8f9fa; padding: 10px; border-radius: 4px; }
        .options-group label { cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: bold; }

        /* 畫布容器（模擬 A4 寬度） */
        #print-area {
            background: white;
            width: 210mm;
            min-height: 140mm;
            margin: 0 auto;
            padding: 20mm;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            gap: 15mm;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* 橫排與豎排控制 */
        .layout-horizontal { flex-direction: row; }
        .layout-vertical { flex-direction: column; }

        /* 【尺寸控制核心】 */
        .card-box {
            border: 2px dashed #ccc;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box; 
            background: #fafafa;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        /* 1. 身分證尺寸樣式 (預設滿版 86x54) */
        .mode-id {
            width: 86mm;
            height: 54mm;
            padding: 0px;
        }
        /* 身分證補 3mm 邊 */
        .mode-id.has-padding {
            padding: 3mm;
        }

        /* 2. 存摺封面尺寸樣式 (標準 150mm x 92mm) */
        .mode-bank {
            width: 150mm;
            height: 92mm;
            padding: 0px;
        }

        .card-box img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            background: transparent;
        }
        
        .card-box input[type="file"] { display: none; }
        .placeholder { color: #888; font-size: 14px; text-align: center; pointer-events: none; padding: 10px; }

        /* --- 🖨️ 列印專用樣式 --- */
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            #print-area {
                box-shadow: none;
                margin: 0;
                padding: 0;
                width: auto;
                height: auto;
            }
            .card-box {
                border: none !important; 
                background: transparent !important;
            }
            /* 確保列印時強制精準度 */
            .mode-id { width: 86mm !important; height: 54mm !important; }
            .mode-bank { width: 150mm !important; height: 92mm !important; }
        }
    </style>
</head>
<body>

    <div class="controls no-print">
        <h2>證件 / 存摺封面 線上列印工具</h2>
        
        <div class="tab-group">
            <button class="tab-btn active" onclick="switchMode('id')">🪪 身分證列印</button>
            <button class="tab-btn" onclick="switchMode('bank')">🏦 銀行/郵局存摺封面</button>
        </div>

        <div>
            <button class="btn btn-secondary" onclick="changeLayout('horizontal')">橫排 (左右)</button>
            <button class="btn btn-secondary" onclick="changeLayout('vertical')">豎排 (上下)</button>
            <button class="btn" onclick="window.print()">🖨️ 開始列印</button>
        </div>

        <div class="options-group" id="id-options">
            <label>
                <input type="radio" name="photo-type" value="raw" checked onchange="togglePadding(false)"> 
                📸 照片已有透明邊（直接滿版 $86 \times 54 \text{mm}$）
            </label>
            <label style="color: #d9534f;">
                <input type="radio" name="photo-type" value="cropped" onchange="togglePadding(true)"> 
                ✂️ 照片已裁切無邊（幫我補 3mm 透明邊）
            </label>
        </div>

        <div class="options-group" id="bank-options" style="display: none; color: #555;">
            💡 提示：存摺封面已自動鎖定標準尺寸 ($150 \times 92 \text{mm}$)，上傳後即可直接完美列印。
        </div>
    </div>

    <div id="print-area" class="layout-horizontal">
        
        <label class="card-box mode-id" id="box-front">
            <span class="placeholder" id="text-front">點選上傳【身分證正面】照片</span>
            <input type="file" accept="image/*" onchange="handleUpload(this, 'front')">
        </label>

        <label class="card-box mode-id" id="box-back">
            <span class="placeholder">點選上傳【身分證反面】照片</span>
            <input type="file" accept="image/*" onchange="handleUpload(this, 'back')">
        </label>

    </div>

    <script>
        // 儲存上傳的圖片資料
        const imgData = { front: null, back: null };
        let currentMode = 'id'; // 預設為身分證模式

        function handleUpload(input, type) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgData[type] = e.target.result;
                    renderImage(type);
                }
                reader.readAsDataURL(file);
            }
        }

        function renderImage(type) {
            const box = document.getElementById(`box-${type}`);
            if (imgData[type]) {
                box.innerHTML = `
                    <img src="${imgData[type]}" alt="${type}">
                    <input type="file" accept="image/*" onchange="handleUpload(this, '${type}')">
                `;
            }
        }

        // 核心切換邏輯：身分證 vs 存摺封面
        function switchMode(mode) {
            currentMode = mode;
            
            // 更新頁籤外觀
            const tabs = document.querySelectorAll('.tab-btn');
            tabs[0].classList.toggle('active', mode === 'id');
            tabs[1].classList.toggle('active', mode === 'bank');

            // 顯示/隱藏 對應的設定選項
            document.getElementById('id-options').style.display = mode === 'id' ? 'flex' : 'none';
            document.getElementById('bank-options').style.display = mode === 'bank' ? 'block' : 'none';

            const boxFront = document.getElementById('box-front');
            const boxBack = document.getElementById('box-back');
            const textFront = document.getElementById('text-front');

            if (mode === 'id') {
                // 回復身分證狀態
                boxFront.className = 'card-box mode-id';
                boxBack.className = 'card-box mode-id';
                boxBack.style.display = 'flex'; // 顯示反面
                if(!imgData.front) textFront.innerText = "點選上傳【身分證正面】照片";
                togglePadding(document.querySelector('input[name="photo-type"]:checked').value === 'cropped');
            } else {
                // 切換至存摺封面狀態
                boxFront.className = 'card-box mode-bank';
                boxBack.style.display = 'none'; // 隱藏反面（存摺只需要一頁）
                if(!imgData.front) textFront.innerText = "點選上傳【存摺封面】照片";
            }
        }

        function changeLayout(direction) {
            const area = document.getElementById('print-area');
            area.className = direction === 'horizontal' ? 'layout-horizontal' : 'layout-vertical';
        }

        function togglePadding(shouldAddPadding) {
            if (currentMode !== 'id') return; // 只有身分證模式需要控制補邊
            const boxes = document.querySelectorAll('.card-box');
            boxes.forEach(box => {
                if (shouldAddPadding) {
                    box.classList.add('has-padding');
                } else {
                    box.classList.remove('has-padding');
                }
            });
        }
    </script>
</body>
</html>
