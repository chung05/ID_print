<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身分證線上方正列印工具</title>
    <style>
        /* --- 網頁預覽樣式 --- */
        body { font-family: sans-serif; background: #f5f5f5; padding: 20px; text-align: center; }
        .controls { margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px; max-width: 600px; margin: 0 auto 20px auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; margin: 5px; }
        .btn:hover { background: #0056b3; }
        
        .options-group { margin: 15px 0; font-size: 15px; display: flex; justify-content: center; gap: 20px; }
        .options-group label { cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: bold; }

        /* 畫布容器（模擬 A4 寬度） */
        #print-area {
            background: white;
            width: 210mm;
            min-height: 140mm;
            margin: 0 auto;
            padding: 20mm;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            gap: 15mm;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* 橫排與豎排控制 */
        .layout-horizontal { flex-direction: row; }
        .layout-vertical { flex-direction: column; }

        /* 【精準尺寸控制】總外框鎖定在 86mm x 54mm */
        .card-box {
            width: 86mm;
            height: 54mm;
            padding: 0px; /* 預設滿版 */
            border: 2px dashed #ccc;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box; 
            background: #fafafa;
            cursor: pointer;
            position: relative;
            transition: padding 0.2s ease;
        }
        
        /* 動態加入 3mm 透明邊的樣式 */
        .card-box.has-padding {
            padding: 3mm;
        }
        
        .card-box img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            background: transparent;
        }
        
        .card-box input[type="file"] { display: none; }
        .placeholder { color: #888; font-size: 14px; text-align: center; pointer-events: none; }

        /* --- 🖨️ 列印專用樣式 --- */
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            #print-area {
                box-shadow: none;
                margin: 0;
                padding: 0;
                width: auto;
                height: auto;
            }
            .card-box {
                width: 86mm !important;
                height: 54mm !important;
                border: none !important; 
                background: transparent !important;
            }
        }
    </style>
</head>
<body>

    <div class="controls no-print">
        <h2>身分證列印工具（彈性邊距版）</h2>
        
        <div>
            <button class="btn" onclick="changeLayout('horizontal')">橫排 (左右)</button>
            <button class="btn" onclick="changeLayout('vertical')">豎排 (上下)</button>
            <button class="btn" style="background:#28a745;" onclick="window.print()">🖨️ 開始列印</button>
        </div>

        <div class="options-group">
            <label>
                <input type="radio" name="photo-type" value="raw" checked onchange="togglePadding(false)"> 
                📸 照片已有透明邊（直接滿版 $86 \times 54 \text{mm}$）
            </label>
            <label style="color: #d9534f;">
                <input type="radio" name="photo-type" value="cropped" onchange="togglePadding(true)"> 
                ✂️ 照片已裁切無邊（幫我補 3mm 透明邊）
            </label>
        </div>
    </div>

    <div id="print-area" class="layout-horizontal">
        
        <label class="card-box" id="box-front">
            <span class="placeholder">點選上傳【正面】照片</span>
            <input type="file" accept="image/*" onchange="handleUpload(this, 'front')">
        </label>

        <label class="card-box" id="box-back">
            <span class="placeholder">點選上傳【反面】照片</span>
            <input type="file" accept="image/*" onchange="handleUpload(this, 'back')">
        </label>

    </div>

    <script>
        // 儲存目前使用者上傳的圖片 Base64 資料，避免切換開關時圖片消失
        const imgData = { front: null, back: null };

        function handleUpload(input, type) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgData[type] = e.target.result;
                    renderImage(type);
                }
                reader.readAsDataURL(file);
            }
        }

        // 渲染圖片，保持 input 欄位不被覆蓋，方便重複點選更換圖片
        function renderImage(type) {
            const box = document.getElementById(`box-${type}`);
            if (imgData[type]) {
                box.innerHTML = `
                    <img src="${imgData[type]}" alt="${type}">
                    <input type="file" accept="image/*" onchange="handleUpload(this, '${type}')">
                `;
            }
        }

        // 切換直式或橫式排版
        function changeLayout(direction) {
            const area = document.getElementById('print-area');
            area.className = direction === 'horizontal' ? 'layout-horizontal' : 'layout-vertical';
        }

        // 精確控制邊距開關
        function togglePadding(shouldAddPadding) {
            const boxes = document.querySelectorAll('.card-box');
            boxes.forEach(box => {
                if (shouldAddPadding) {
                    box.classList.add('has-padding');
                } else {
                    box.classList.remove('has-padding');
                }
            });
        }
    </script>
</body>
</html>
